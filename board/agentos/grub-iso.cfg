# AgentOS — menú GRUB del ISO (BIOS y UEFI). El sistema se carga en RAM (initrd).
# __KERNEL_PATH__ / __INITRD_PATH__ los sustituye Buildroot.
set default="0"
set timeout="3"
set timeout_style="menu"
set color_normal="light-gray/black"
set menu_color_normal="light-gray/black"
set menu_color_highlight="black/light-gray"
terminal_output console

menuentry "AgentOS" {
    linux __KERNEL_PATH__ rdinit=/init quiet splash console=tty1 agentos.live=1
    initrd __INITRD_PATH__
}

menuentry "AgentOS (modo recuperación)" {
    linux __KERNEL_PATH__ rdinit=/bin/sh loglevel=7 console=tty1 agentos.live=1
    initrd __INITRD_PATH__
}
