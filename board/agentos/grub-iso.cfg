# AgentOS — menú GRUB del ISO (BIOS y UEFI).
# __KERNEL_PATH__ / __INITRD_PATH__ los sustituye Buildroot.
# Mantener Shift pulsado al arrancar para ver el menú de recuperación.
set default="0"
set timeout="0"
set timeout_style="hidden"
terminal_output console

menuentry "AgentOS" {
    linux __KERNEL_PATH__ rdinit=/init \
        quiet loglevel=0 vt.global_cursor_default=0 console=tty3 agentos.live=1
    initrd __INITRD_PATH__
}

menuentry "AgentOS (modo recuperación)" {
    linux __KERNEL_PATH__ rdinit=/bin/sh loglevel=7 console=tty1 agentos.live=1
    initrd __INITRD_PATH__
}
