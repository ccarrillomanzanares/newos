# Configuración embebida en la imagen GRUB (BIOS y UEFI).
# Localiza el medio que contiene /boot/grub/grub.cfg (partición EFI del USB
# o el propio ISO) y carga desde ahí el menú de AgentOS.
if [ ! -f /boot/grub/grub.cfg ]; then
    search --no-floppy --file --set=root /boot/grub/grub.cfg
fi
set prefix=($root)/boot/grub
