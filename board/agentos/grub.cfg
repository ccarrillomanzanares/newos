# AgentOS — menú GRUB (USB live e instalación en disco).
# @ROOT@ lo sustituye post-build.sh (USB) o agentos-install (disco interno).
set default="0"
set timeout="3"
set timeout_style="menu"
set color_normal="light-gray/black"
set menu_color_normal="light-gray/black"
set menu_color_highlight="black/light-gray"
terminal_output console

menuentry "AgentOS" {
    linux /boot/bzImage root=@ROOT@ rootwait rw quiet splash console=tty1
}

menuentry "AgentOS (modo recuperación)" {
    linux /boot/bzImage root=@ROOT@ rootwait rw loglevel=7 console=tty1 init=/bin/sh
}
