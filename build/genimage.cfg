# AgentOS — genimage: imagen USB híbrida BIOS + UEFI (agentos.img).
# La genera board/agentos/post-image.sh. El ISO (agentos.iso, El Torito
# BIOS + UEFI) lo produce Buildroot con BR2_TARGET_ROOTFS_ISO9660.
#
# Disposición (tabla MBR, firma de disco fija 0xa6e705a1):
#   sector 0      boot.img de GRUB (446 bytes, sin tocar la tabla de particiones)
#   sector 1..    grub.img (núcleo GRUB BIOS) en el hueco previo a la partición 1
#   partición 1   EFI (FAT, tipo 0xEF): EFI/BOOT/bootx64.efi, boot/bzImage, boot/grub/grub.cfg
#   partición 2   rootfs ext4 -> root=PARTUUID=a6e705a1-02

image efi-part.vfat {
	vfat {
		label = "AGENTOS_EFI"
		file EFI {
			image = "esp-usb/EFI"
		}
		file boot {
			image = "esp-usb/boot"
		}
	}
	size = 64M
}

image agentos.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = 0xa6e705a1
	}

	partition mbr-boot {
		in-partition-table = "no"
		image = "boot.img"
		offset = 0
		size = 512
		holes = {"(440; 512)"}
	}

	partition grub {
		in-partition-table = "no"
		image = "grub.img"
		offset = 512
	}

	partition efi {
		partition-type = 0xEF
		bootable = "true"
		image = "efi-part.vfat"
		offset = 1M
	}

	partition root {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
