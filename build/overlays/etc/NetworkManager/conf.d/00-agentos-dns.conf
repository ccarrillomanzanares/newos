# AgentOS — DNS.
#
# NetworkManager, con su configuración por defecto, intenta gestionar el DNS
# mediante systemd-resolved (rc-manager=symlink). AgentOS usa BusyBox init, así
# que systemd-resolved NO existe: NM no escribe nunca /etc/resolv.conf y el
# sistema se queda sin resolución de nombres.
#
# Consecuencia real medida en la VM: /etc/resolv.conf es un symlink a
# ../tmp/resolv.conf que no existía, y cualquier salida a internet fallaba con
# "[Errno -3] Temporary failure in name resolution". AgentD lo interpretaba como
# "no hay ningún backend LLM disponible" y terminaba. En pantalla solo se veía el
# fondo del compositor, sin ninguna pista.
#
# rc-manager=file hace que NM escriba él mismo el fichero, sin resolved.
[main]
dns=default
rc-manager=file
