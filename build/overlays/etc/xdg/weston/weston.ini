[core]
shell=desktop
idle-time=0

# shell=desktop (no kiosk): kiosk fija UNA sola app a pantalla completa y el
# agente no podría abrir el editor, el reproductor o el navegador encima.
# Con desktop, cog abre la interfaz y las demás apps van en ventanas.

# El shell desktop trae de serie un panel con reloj y lanzador — es decir, una
# "barra" con iconos, justo lo que AgentOS no quiere. panel-position=none la
# desactiva y deja solo las ventanas.
[shell]
panel-position=none

# Teclado en español (el sistema está configurado en es_ES)
[keyboard]
keymap_layout=es
