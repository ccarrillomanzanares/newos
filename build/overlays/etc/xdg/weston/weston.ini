[core]
shell=desktop
idle-time=0

# shell=desktop (no kiosk): kiosk fija UNA sola app a pantalla completa y el
# agente no podría abrir el editor, el reproductor o el navegador encima.
# Con desktop, cog abre la interfaz y las demás apps van en ventanas.

# El shell desktop trae de serie un panel con reloj y lanzador — es decir, una
# "barra" con iconos, justo lo que AgentOS no quiere. panel-position=none la
# desactiva y deja solo las ventanas.
[shell]
panel-position=none

# Teclado en español (el sistema está configurado en es_ES)
[keyboard]
keymap_layout=es

# Teclado en pantalla (OSK) de Weston: DESACTIVADO a proposito.
# El OSK de Weston entrega la entrada por el protocolo text-input y WPE (cog) NO
# la traduce al campo HTML: se veian las teclas y los puntos, pero el input iba
# VACIO y al conectar salia 'Secrets were required, but not provided'. La
# interfaz trae su PROPIO teclado en pantalla (mountKbd en index.html), que
# escribe directo en el campo. Sin path, Weston no lanza weston-keyboard.
[input-method]
path=

# Touchpad: toque ligero = clic (enable-tap). Sin esto hay que pulsar el boton
# fisico izquierdo para activar la ventana (el shell desktop de Weston exige
# activar la superficie para darle el foco de teclado). Con tap, un toque basta.
[libinput]
enable-tap=true
tap-and-drag=true
