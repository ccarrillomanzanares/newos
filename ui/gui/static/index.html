<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentOS</title>
<style>
  :root { --bg:#080808; --fg:#e8e8e8; --accent:#c8a882; --dim:#555; --err:#8b3a3a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font:300 18px/1.6 system-ui,'Segoe UI',sans-serif; cursor:default; user-select:none; }
  main { height:100%; display:flex; flex-direction:column; align-items:center; padding:12vh 24px 0; }

  /* Círculo */
  #orb { position:relative; width:120px; height:120px; flex:none; border-radius:50%;
    border:1.5px solid var(--accent); opacity:.75; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    animation:breathe 3s ease-in-out infinite; transition:border-color .6s, opacity .6s; }
  #orb svg { width:30px; height:30px; stroke:var(--accent); fill:none; stroke-width:1.4;
    stroke-linecap:round; transition:opacity .4s; }
  #orb .dots { position:absolute; display:none; gap:7px; }
  #orb .dots i { width:5px; height:5px; border-radius:50%; background:var(--accent);
    animation:dot 1.2s ease-in-out infinite; }
  #orb .dots i:nth-child(2){animation-delay:.2s} #orb .dots i:nth-child(3){animation-delay:.4s}
  #orb::after { content:""; position:absolute; inset:-1.5px; border-radius:50%;
    border:1.5px solid transparent; border-top-color:var(--fg); opacity:0; }

  #orb.listening { animation-duration:1.1s; opacity:1; border-color:#e6c9a3; }
  #orb.thinking { animation:none; opacity:1; }
  #orb.thinking::after { opacity:.55; animation:spin 1.4s linear infinite; }
  #orb.thinking svg { opacity:0; } #orb.thinking .dots { display:flex; }
  #orb.error, #orb.offline { border-color:var(--err); }
  #orb.offline { animation-duration:6s; opacity:.5; }

  @keyframes breathe { 0%,100%{transform:scale(.97)} 50%{transform:scale(1.03)} }
  @keyframes spin { to{transform:rotate(360deg)} }
  @keyframes dot { 0%,100%{opacity:.2} 50%{opacity:1} }

  /* Conversación */
  #log { width:100%; max-width:680px; margin-top:7vh; flex:1; overflow:hidden;
    display:flex; flex-direction:column; justify-content:flex-start; gap:4px; user-select:text; }
  .turn { transition:opacity 1.2s; white-space:pre-wrap; word-wrap:break-word; }
  .turn.user { color:var(--accent); margin-top:18px; }
  .turn.agent { color:var(--fg); }
  .turn.fading { opacity:0; }
  .tool { color:var(--dim); font-size:13px; letter-spacing:.02em; transition:opacity .5s; }
  .confirm { color:var(--dim); font-size:15px; margin-top:6px; }
  .confirm b { color:var(--fg); font-weight:400; }
  .confirm button { background:none; border:0; border-bottom:1px solid #333; color:var(--accent);
    font:inherit; margin-left:14px; cursor:pointer; padding:0 2px; }
  .confirm button:hover { border-color:var(--accent); }
  .link { color:var(--accent); cursor:pointer; border-bottom:1px solid #3a3228; }

  /* Entrada */
  form { width:100%; max-width:680px; padding:18px 0 5vh; flex:none; }
  #input { width:100%; background:transparent; border:0; border-bottom:1px solid #333; outline:0;
    color:var(--fg); font:inherit; padding:6px 2px; caret-color:var(--accent); }
  #input::placeholder { color:#262626; }
  #input:focus { border-bottom-color:#444; }

  /* Visor */
  #viewer { position:fixed; inset:0; background:rgba(0,0,0,.88); display:none;
    align-items:center; justify-content:center; padding:5vh 5vw; cursor:zoom-out; z-index:10; }
  #viewer.open { display:flex; animation:fade .4s; }
  #viewer img, #viewer iframe { max-width:100%; max-height:100%; border:0; }
  #viewer iframe { width:90vw; height:90vh; background:#111; }
  #viewer pre { max-width:900px; max-height:90vh; overflow:auto; color:var(--fg);
    font:14px/1.5 ui-monospace,monospace; white-space:pre-wrap; cursor:auto; }
  @keyframes fade { from{opacity:0} }
</style>
</head>
<body>
<main>
  <div id="orb" class="offline" title="">
    <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/>
      <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
    <div class="dots"><i></i><i></i><i></i></div>
  </div>
  <div id="log" aria-live="polite"></div>
  <form id="form" autocomplete="off"><input id="input" placeholder="..." spellcheck="false" autofocus></form>
</main>
<div id="viewer"></div>

<script>
"use strict";
const MAX_TURNS = 4;                       // intercambios visibles
const $ = id => document.getElementById(id);
const orb = $("orb"), log = $("log"), input = $("input"), viewer = $("viewer");
let ws = null, current = null, busy = false, listening = false;
const tools = new Map();                   // id → elemento "⚙ nombre..."

function setState(s) { orb.className = s; }
function idle() { setState(listening ? "listening" : ""); }

/* ---------- conversación ---------- */
function prune() {
  const users = log.querySelectorAll(".turn.user:not(.fading)");
  if (users.length <= MAX_TURNS) return;
  const cut = users[users.length - MAX_TURNS];
  for (let el = log.firstElementChild; el && el !== cut; el = el.nextElementSibling) {
    if (el.classList.contains("fading")) continue;
    el.classList.add("fading");
    setTimeout(n => n.remove(), 1200, el);
  }
}
function addTurn(cls, text = "") {
  const el = document.createElement("div");
  el.className = "turn " + cls;
  el.textContent = text;
  log.appendChild(el);
  return el;
}
function agentTurn() { return current || (current = addTurn("agent")); }

/* ---------- visor de contenido ---------- */
const IMG = /\.(png|jpe?g|gif|webp|svg|bmp)$/i;
const PATH_RE = /(https?:\/\/[^\s"'<>)]+|(?:~|\/)[\w.\-\/]+\.(?:png|jpe?g|gif|webp|svg|bmp|pdf|txt|md|log|json|py|sh|csv|html)(?![\w\-\/]))/gi;
function srcFor(p) { return /^https?:/.test(p) ? p : "/file?path=" + encodeURIComponent(p); }

async function show(p) {
  viewer.textContent = "";
  let el;
  if (IMG.test(p.split("?")[0])) { el = document.createElement("img"); el.src = srcFor(p); el.alt = ""; }
  else if (/\.pdf$/i.test(p) || /^https?:/.test(p)) { el = document.createElement("iframe"); el.src = srcFor(p); }
  else {
    el = document.createElement("pre");
    try { const r = await fetch(srcFor(p)); el.textContent = r.ok ? await r.text() : "No se puede abrir " + p; }
    catch { el.textContent = "No se puede abrir " + p; }
    el.onclick = e => e.stopPropagation();
  }
  viewer.appendChild(el);
  viewer.classList.add("open");
}
viewer.onclick = () => { viewer.classList.remove("open"); viewer.textContent = ""; input.focus(); };
document.addEventListener("keydown", e => { if (e.key === "Escape" && viewer.classList.contains("open")) viewer.onclick(); });

/* Convierte rutas/URLs del texto final en enlaces; abre la primera imagen automáticamente */
function linkify(el) {
  const text = el.textContent, found = [];
  PATH_RE.lastIndex = 0;
  if (!PATH_RE.test(text)) return;
  el.textContent = "";
  let last = 0;
  text.replace(PATH_RE, (m, _g, off) => {
    const clean = m.replace(/[.,;:]+$/, "");
    el.append(text.slice(last, off));
    const a = document.createElement("span");
    a.className = "link"; a.textContent = clean; a.onclick = () => show(clean);
    el.append(a, m.slice(clean.length));
    last = off + m.length; found.push(clean);
    return m;
  });
  el.append(text.slice(last));
  const img = found.find(p => IMG.test(p.split("?")[0]));
  if (img) show(img);
}

/* ---------- WebSocket ---------- */
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

function connect() {
  const proto = location.protocol === "https:" ? "wss://" : "ws://";
  ws = new WebSocket(proto + (location.host || "localhost:8080") + "/ws");
  ws.onopen = () => idle();
  ws.onclose = () => {
    setState("offline"); busy = false; current = null;
    log.querySelectorAll(".confirm, .tool").forEach(n => n.remove()); tools.clear();
    setTimeout(connect, 2000);
  };
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    switch (m.type) {
      case "ready": orb.title = m.llm || ""; idle(); break;
      case "token": setState("thinking"); agentTurn().textContent += m.text; break;
      case "tool": {
        setState("thinking");
        if (m.status === "running") {
          const t = document.createElement("div");
          t.className = "tool"; t.textContent = "⚙ " + m.name + "...";
          log.appendChild(t); tools.set(m.id, t);
          current = null;   // el texto posterior va en una línea nueva
        } else {
          const t = tools.get(m.id); tools.delete(m.id);
          if (t) {
            if (m.status === "error") t.textContent = "⚙ " + m.name + " — error";
            setTimeout(() => { t.style.opacity = 0; setTimeout(() => t.remove(), 500); },
                       m.status === "error" ? 2500 : 300);
          }
        }
        break;
      }
      case "confirm": askConfirm(m); break;
      case "done": {
        const el = current && current.textContent ? current
                 : (m.text ? addTurn("agent", m.text) : null);
        if (el) linkify(el);
        current = null; busy = false; idle(); input.focus(); break;
      }
      case "error":
        setState("error");
        addTurn("agent", m.text).style.color = "#8b6a6a";
        busy = false; current = null;
        setTimeout(() => { if (ws.readyState === 1 && !busy) idle(); }, 3000);
        break;
    }
  };
}

function askConfirm(m) {
  setState("listening");
  const box = document.createElement("div");
  box.className = "confirm";
  const what = m.args && (m.args.command || m.args.path || m.args.name) || JSON.stringify(m.args || {});
  box.append("¿Permitir ", Object.assign(document.createElement("b"), { textContent: m.name + ": " + what }), "?");
  const answer = ok => {
    send({ type: "confirm", id: m.id, approved: ok });
    box.textContent = ok ? "Permitido." : "Cancelado.";
    setTimeout(() => { box.style.opacity = 0; box.remove(); }, 1500);
    setState("thinking"); input.focus();
  };
  for (const [label, ok] of [["Sí", true], ["No", false]]) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.onclick = () => answer(ok);
    box.appendChild(b);
  }
  log.appendChild(box); current = null;
}

/* ---------- entrada ---------- */
$("form").onsubmit = e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy || !ws || ws.readyState !== 1) return;
  input.value = "";
  addTurn("user", text);
  current = null; busy = true;
  setState("thinking");
  send({ type: "message", text });
  prune();
};

/* Clic en el círculo: reservado para la voz (por ahora solo alterna el estado visual) */
orb.onclick = () => { if (orb.classList.contains("offline")) return; listening = !listening; if (!busy) idle(); input.focus(); };
document.addEventListener("click", e => { if (!viewer.contains(e.target) && !window.getSelection().toString()) input.focus(); });

connect();
</script>
</body>
</html>
