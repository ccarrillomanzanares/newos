<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentOS</title>
<style>
  :root { --bg:#080808; --fg:#e8e8e8; --accent:#c8a882; --dim:#555; --err:#8b3a3a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font:300 18px/1.6 system-ui,'Segoe UI',sans-serif; cursor:default; user-select:none; }
  main { height:100%; display:flex; flex-direction:column; align-items:center; padding:5vh 24px 0; }

  /* Círculo */
  #orb { position:relative; width:120px; height:120px; flex:none; border-radius:50%;
    border:1.5px solid var(--accent); opacity:.75; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    animation:breathe 3s ease-in-out infinite; transition:border-color .6s, opacity .6s; }
  #orb svg { width:30px; height:30px; stroke:var(--accent); fill:none; stroke-width:1.4;
    stroke-linecap:round; transition:opacity .4s; }
  #orb .dots { position:absolute; display:none; gap:7px; }
  #orb .dots i { width:5px; height:5px; border-radius:50%; background:var(--accent);
    animation:dot 1.2s ease-in-out infinite; }
  #orb .dots i:nth-child(2){animation-delay:.2s} #orb .dots i:nth-child(3){animation-delay:.4s}
  #orb::after { content:""; position:absolute; inset:-1.5px; border-radius:50%;
    border:1.5px solid transparent; border-top-color:var(--fg); opacity:0; }

  #orb.listening { animation-duration:1.1s; opacity:1; border-color:#e6c9a3; }
  #orb.thinking { animation:none; opacity:1; }
  #orb.thinking::after { opacity:.55; animation:spin 1.4s linear infinite; }
  #orb.thinking svg { opacity:0; } #orb.thinking .dots { display:flex; }
  #orb.error, #orb.offline { border-color:var(--err); }
  #orb.offline { animation-duration:6s; opacity:.5; }

  @keyframes breathe { 0%,100%{transform:scale(.97)} 50%{transform:scale(1.03)} }
  @keyframes spin { to{transform:rotate(360deg)} }
  @keyframes dot { 0%,100%{opacity:.2} 50%{opacity:1} }

  /* Conversación */
  #log { width:100%; max-width:680px; margin-top:3vh; flex:1; overflow-y:auto;
    display:flex; flex-direction:column; justify-content:flex-end; gap:4px;
    user-select:text; -webkit-user-select:text; cursor:text;
    scrollbar-width:thin; }
  #log::-webkit-scrollbar { width:6px; } #log::-webkit-scrollbar-thumb { background:#222; }
  .turn { transition:opacity 1.2s; white-space:pre-wrap; word-wrap:break-word;
    user-select:text; -webkit-user-select:text; }
  .turn.user { color:var(--accent); margin-top:18px; }
  .turn.agent { color:var(--fg); }
  .turn.fading { opacity:0; }
  .tool { color:var(--dim); font-size:13px; letter-spacing:.02em; transition:opacity .5s; }
  .confirm { color:var(--dim); font-size:15px; margin-top:6px; }
  .confirm b { color:var(--fg); font-weight:400; }
  .confirm button { background:none; border:0; border-bottom:1px solid #333; color:var(--accent);
    font:inherit; margin-left:14px; cursor:pointer; padding:0 2px; }
  .confirm button:hover { border-color:var(--accent); }
  .link { color:var(--accent); cursor:pointer; border-bottom:1px solid #3a3228; }

  /* Indicador de que el agente trabaja (siempre visible bajo la conversacion) */
  #think { display:none; align-items:center; gap:8px; max-width:680px; width:100%;
    padding:10px 2px 2px; color:var(--dim); font-size:14px; letter-spacing:.08em; flex:none; }
  #think.on { display:flex; }
  #think .d { width:6px; height:6px; border-radius:50%; background:var(--accent);
    animation:dot 1.2s ease-in-out infinite; }
  #think .d:nth-child(2){animation-delay:.2s} #think .d:nth-child(3){animation-delay:.4s}
  #think .txt { color:var(--dim); }

  /* Entrada */
  form { width:100%; max-width:680px; padding:14px 0 3vh; flex:none; }
  #input { width:100%; background:transparent; border:0; border-bottom:1px solid #333; outline:0;
    color:var(--fg); font:inherit; padding:6px 2px; caret-color:var(--accent); }
  #input::placeholder { color:#262626; }
  #input:focus { border-bottom-color:#444; }


  /* Paneles de arranque (red / proveedor). Se desvanecen tras el OK. */
  #panel { position:fixed; inset:0; background:rgba(8,8,8,.94); display:none;
    align-items:center; justify-content:center; z-index:20; }
  #panel.open { display:flex; }
  .card { width:100%; max-width:460px; padding:0 24px; }
  .card h2 { font-weight:300; font-size:20px; margin-bottom:8px; }
  .card .sub { font-size:14px; color:var(--dim); margin-bottom:20px; line-height:1.5; }
  .netlist { list-style:none; max-height:46vh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .netlist li { display:flex; align-items:center; gap:10px; padding:8px 6px; cursor:pointer;
    border-bottom:1px solid #111; font-size:15px; }
  .netlist li .sec { color:#444; font-size:12px; }
  .ssid { color:var(--accent); word-break:break-all; }
  .netlist li .d { width:8px; height:8px; border-radius:50%; border:1.4px solid var(--dim); flex:none; }
  .netlist li.sel .d { background:var(--accent); border-color:var(--accent); }
  .netlist li .n { flex:1; font-size:16px; }
  .netlist li.sel .n { color:var(--accent); }
  .field { margin-top:16px; }
  .field input { width:100%; background:transparent; border:0; border-bottom:1px solid #333;
    outline:0; color:var(--fg); font:inherit; padding:7px 2px; caret-color:var(--accent); }
  .field input::placeholder { color:#262626; }
  .field input:focus { border-bottom-color:#555; }
  .btn { width:100%; margin-top:22px; background:none; border:1px solid #2a2a2a; color:var(--accent);
    font:inherit; font-size:16px; padding:11px; cursor:pointer; transition:border-color .3s; }
  .btn:hover { border-color:var(--accent); }
  .btn:disabled { color:#333; border-color:#1a1a1a; cursor:default; }
  .btn.mini { width:auto; margin:0; padding:2px 6px; border:0; font-size:14px; }
  .msg { min-height:22px; margin-top:12px; font-size:14px; color:var(--dim); text-align:center; }
  .skip { display:block; margin:14px auto 0; background:none; border:0; color:#3a3a3a;
    font:inherit; font-size:14px; cursor:pointer; }
  .skip:hover { color:var(--dim); }


  /* Teclado en pantalla PROPIO. El de Weston pinta las teclas pero no escribe
     en el campo (WPE no actualiza el input por el protocolo text-input). Este
     teclado escribe directo en el input por JS: siempre funciona. */
  #kbd { margin-top:14px; user-select:none; }
  #kbd .krow { display:flex; justify-content:center; gap:5px; margin-top:5px; }
  #kbd .key { flex:1 1 0; max-width:52px; min-width:30px; text-align:center;
    background:#111; border:1px solid #1e1e1e; border-radius:4px; color:#d8d8d8;
    font-size:16px; padding:11px 0; cursor:pointer; }
  #kbd .key:active { background:#1c1c1c; }
  #kbd .key.acc { color:var(--accent); }
  #kbd .key.w2 { flex:2 1 0; max-width:120px; }
  #kbd .key.w3 { flex:5 1 0; max-width:none; }

  /* Visor */
  #viewer { position:fixed; inset:0; background:rgba(0,0,0,.88); display:none;
    align-items:center; justify-content:center; padding:5vh 5vw; cursor:zoom-out; z-index:10; }
  #viewer.open { display:flex; animation:fade .4s; }
  #viewer img, #viewer iframe { max-width:100%; max-height:100%; border:0; }
  #viewer iframe { width:90vw; height:90vh; background:#111; }
  #viewer pre { max-width:900px; max-height:90vh; overflow:auto; color:var(--fg);
    font:14px/1.5 ui-monospace,monospace; white-space:pre-wrap; cursor:auto; }
  @keyframes fade { from{opacity:0} }
</style>
</head>
<body>
<main>
  <div id="orb" class="offline" title="">
    <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/>
      <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
    <div class="dots"><i></i><i></i><i></i></div>
  </div>
  <div id="log" aria-live="polite"></div>
  <div id="think"><span class="d"></span><span class="d"></span><span class="d"></span><span class="txt">el agente está trabajando…</span></div>
  <form id="form" autocomplete="off"><input id="input" placeholder="..." spellcheck="false" autofocus></form>
</main>
<div id="viewer"></div>
<div id="panel"><div class="card" id="card"></div></div>


<script>
"use strict";
const MAX_TURNS = 4;                       // intercambios visibles
const $ = id => document.getElementById(id);
const orb = $("orb"), log = $("log"), input = $("input"), viewer = $("viewer");
let ws = null, current = null, busy = false, listening = false, shownOffline = false;
const tools = new Map();                   // id → elemento "⚙ nombre..."

function setState(s) { orb.className = s; }
function thinkOn(txt) { const t = document.getElementById('think'); if (t) { t.querySelector('.txt').textContent = txt || 'el agente está trabajando…'; t.classList.add('on'); scrollLog(); } }
function thinkOff() { const t = document.getElementById('think'); if (t) t.classList.remove('on'); }
function scrollLog() { const l = document.getElementById('log'); if (l) l.scrollTop = l.scrollHeight; }
function idle() { setState(listening ? "listening" : ""); }

/* ---------- conversación ---------- */
function prune() {
  const users = log.querySelectorAll(".turn.user:not(.fading)");
  if (users.length <= MAX_TURNS) return;
  const cut = users[users.length - MAX_TURNS];
  for (let el = log.firstElementChild; el && el !== cut; el = el.nextElementSibling) {
    if (el.classList.contains("fading")) continue;
    el.classList.add("fading");
    setTimeout(n => n.remove(), 1200, el);
  }
}
function addTurn(cls, text = "") {
  const el = document.createElement("div");
  el.className = "turn " + cls;
  el.textContent = text;
  log.appendChild(el);
  return el;
}
function agentTurn() { return current || (current = addTurn("agent")); }

/* ---------- visor de contenido ---------- */
const IMG = /\.(png|jpe?g|gif|webp|svg|bmp)$/i;
const PATH_RE = /(https?:\/\/[^\s"'<>)]+|(?:~|\/)[\w.\-\/]+\.(?:png|jpe?g|gif|webp|svg|bmp|pdf|txt|md|log|json|py|sh|csv|html)(?![\w\-\/]))/gi;
function srcFor(p) { return /^https?:/.test(p) ? p : "/file?path=" + encodeURIComponent(p); }

async function show(p) {
  viewer.textContent = "";
  let el;
  if (IMG.test(p.split("?")[0])) { el = document.createElement("img"); el.src = srcFor(p); el.alt = ""; }
  else if (/\.pdf$/i.test(p) || /^https?:/.test(p)) { el = document.createElement("iframe"); el.src = srcFor(p); }
  else {
    el = document.createElement("pre");
    try { const r = await fetch(srcFor(p)); el.textContent = r.ok ? await r.text() : "No se puede abrir " + p; }
    catch { el.textContent = "No se puede abrir " + p; }
    el.onclick = e => e.stopPropagation();
  }
  viewer.appendChild(el);
  viewer.classList.add("open");
}
viewer.onclick = () => { viewer.classList.remove("open"); viewer.textContent = ""; input.focus(); };
document.addEventListener("keydown", e => { if (e.key === "Escape" && viewer.classList.contains("open")) viewer.onclick(); });

/* Convierte rutas/URLs del texto final en enlaces; abre la primera imagen automáticamente */
function linkify(el) {
  const text = el.textContent, found = [];
  PATH_RE.lastIndex = 0;
  if (!PATH_RE.test(text)) return;
  el.textContent = "";
  let last = 0;
  text.replace(PATH_RE, (m, _g, off) => {
    const clean = m.replace(/[.,;:]+$/, "");
    el.append(text.slice(last, off));
    const a = document.createElement("span");
    a.className = "link"; a.textContent = clean; a.onclick = () => show(clean);
    el.append(a, m.slice(clean.length));
    last = off + m.length; found.push(clean);
    return m;
  });
  el.append(text.slice(last));
  const img = found.find(p => IMG.test(p.split("?")[0]));
  if (img) show(img);
}

/* ---------- WebSocket ---------- */
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

function connect() {
  const proto = location.protocol === "https:" ? "wss://" : "ws://";
  ws = new WebSocket(proto + (location.host || "localhost:8080") + "/ws");
  ws.onopen = () => idle();
  ws.onclose = () => {
    setState("offline"); busy = false; current = null; thinkOff();
    log.querySelectorAll(".confirm, .tool").forEach(n => n.remove()); tools.clear();
    setTimeout(connect, 2000);
  };
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    switch (m.type) {
      case "ready": orb.title = m.llm || ""; shownOffline = false; idle(); break;
      case "token": setState("thinking"); agentTurn().textContent += m.text; thinkOn("escribiendo…"); scrollLog(); break;
      case "tool": {
        setState("thinking");
        if (m.status === "running") {
          const t = document.createElement("div");
          t.className = "tool"; t.textContent = "⚙ " + m.name + "...";
          thinkOn("⚙ " + m.name + "…"); scrollLog();
          log.appendChild(t); tools.set(m.id, t);
          current = null;   // el texto posterior va en una línea nueva
        } else {
          const t = tools.get(m.id); tools.delete(m.id);
          if (t) {
            if (m.status === "error") t.textContent = "⚙ " + m.name + " — error";
            setTimeout(() => { t.style.opacity = 0; setTimeout(() => t.remove(), 500); },
                       m.status === "error" ? 2500 : 300);
          }
        }
        break;
      }
      case "confirm": askConfirm(m); break;
      case "done": {
        const el = current && current.textContent ? current
                 : (m.text ? addTurn("agent", m.text) : null);
        if (el) linkify(el);
        current = null; busy = false; idle(); thinkOff(); scrollLog(); input.focus(); break;
      }
      case "error":
        setState("error");
        if (!shownOffline) {              /* solo UNA vez, no en cada reintento */
          shownOffline = true;
          addTurn("agent", m.text).style.color = "#8b6a6a";
        }
        busy = false; current = null; thinkOff();
        setTimeout(() => { if (ws.readyState === 1 && !busy) idle(); }, 3000);
        break;
    }
  };
}

function askConfirm(m) {
  setState("listening");
  const box = document.createElement("div");
  box.className = "confirm";
  const what = m.args && (m.args.command || m.args.path || m.args.name) || JSON.stringify(m.args || {});
  box.append("¿Permitir ", Object.assign(document.createElement("b"), { textContent: m.name + ": " + what }), "?");
  const answer = ok => {
    send({ type: "confirm", id: m.id, approved: ok });
    box.textContent = ok ? "Permitido." : "Cancelado.";
    setTimeout(() => { box.style.opacity = 0; box.remove(); }, 1500);
    setState("thinking"); input.focus();
  };
  for (const [label, ok] of [["Sí", true], ["No", false]]) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.onclick = () => answer(ok);
    box.appendChild(b);
  }
  log.appendChild(box); current = null;
}

/* ---------- entrada ---------- */
$("form").onsubmit = e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy || !ws || ws.readyState !== 1) return;
  input.value = "";
  addTurn("user", text);
  current = null; busy = true;
  setState("thinking");
  thinkOn();
  send({ type: "message", text });
  prune();
};

/* Clic en el círculo: reservado para la voz (por ahora solo alterna el estado visual) */
orb.onclick = () => { if (orb.classList.contains("offline")) return; listening = !listening; if (!busy) idle(); input.focus(); };
document.addEventListener("click", e => {
  // NO robar el foco si hay un panel abierto (contrasena / red / proveedor) ni
  // si el clic es en un input/boton: al pulsar una red, este manejador devolvia
  // el foco al campo del chat y el campo de la contrasena se quedaba sin foco
  // (habia que volver a pulsar el boton izquierdo).
  if (document.getElementById("panel").classList.contains("open")) return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "BUTTON" || t.tagName === "TEXTAREA")) return;
  if (!viewer.contains(t) && !window.getSelection().toString()) input.focus();
});

connect();
boot();
setInterval(() => { if (!busy) boot(); }, 15000);


/* ---------- teclado en pantalla propio ---------- */
const LANGS = [
  { code:"es", name:"Espa\u00f1ol",     rows:[["q","w","e","r","t","y","u","i","o","p"],["a","s","d","f","g","h","j","k","l","\u00f1"],["\u21e7","z","x","c","v","b","n","m","\u00ab","\u00bb"],["?123"," ","\u232b"]] },
  { code:"us", name:"English (US)", rows:[["q","w","e","r","t","y","u","i","o","p"],["a","s","d","f","g","h","j","k","l",";"],["\u21e7","z","x","c","v","b","n","m",",","."],["?123"," ","\u232b"]] },
  { code:"gb", name:"English (UK)", rows:[["q","w","e","r","t","y","u","i","o","p"],["a","s","d","f","g","h","j","k","l",";"],["\u21e7","z","x","c","v","b","n","m",",","."],["?123"," ","\u232b"]] },
  { code:"fr", name:"Fran\u00e7ais",    rows:[["a","z","e","r","t","y","u","i","o","p"],["q","s","d","f","g","h","j","k","l","m"],["\u21e7","w","x","c","v","b","n",",",";",":"],["?123"," ","\u232b"]] },
  { code:"de", name:"Deutsch",    rows:[["q","w","e","r","t","z","u","i","o","p","\u00fc"],["a","s","d","f","g","h","j","k","l","\u00f6","\u00e4"],["\u21e7","y","x","c","v","b","n","m",";",":"],["?123"," ","\u232b"]] },
  { code:"it", name:"Italiano",   rows:[["q","w","e","r","t","y","u","i","o","p"],["a","s","d","f","g","h","j","k","l","\u00f2"],["\u21e7","z","x","c","v","b","n","m",",","."],["?123"," ","\u232b"]] },
  { code:"pt", name:"Portugu\u00eas", rows:[["q","w","e","r","t","y","u","i","o","p"],["a","s","d","f","g","h","j","k","l","\u00e7"],["\u21e7","z","x","c","v","b","n","m",",","."],["?123"," ","\u232b"]] },
];
const KBD_NUM = [["1","2","3","4","5","6","7","8","9","0"],
                 ["-","_","@",".",",",";",":","/","\\","+"],
                 ["\u21e7","(",")","[","]","{","}","\"","'","\u00ab"],
                 ["ABC"," ","\u232b"]];
let kbdLang = "es", kbdLayout = "abc", kbdShift = false;
function kbdRows() {
  if (kbdLayout === "num") return KBD_NUM;
  const L = LANGS.find(l => l.code === kbdLang) || LANGS[0];
  return L.rows;
}
function setLang(code) { kbdLang = code; }   /* mismo idioma para el teclado propio */

const KBD_LAYOUTS = {
  abc: [["q","w","e","r","t","y","u","i","o","p"],
        ["a","s","d","f","g","h","j","k","l","\u00f1"],
        ["\u21e7","z","x","c","v","b","n","m","\u00ab","\u00bb"],
        ["?123"," ","\u232b"]],
  num: [["1","2","3","4","5","6","7","8","9","0"],
        ["-","_","@",".",",",";",":","/","\\","+"],
        ["\u21e7","(",")","[","]","{","}","\"","'","\u00ab"],
        ["ABC"," ","\u232b"]],
};

function mountKbd(input) {
  const host = $("kbd"); if (!host || !input) return;
  function draw() {
    host.innerHTML = "";
    kbdRows().forEach(row => {
      const r = document.createElement("div"); r.className = "krow";
      row.forEach(k => {
        const b = document.createElement("div");
        b.className = "key" + (k.length > 1 ? (k === " " ? " w3" : " w2") : "") +
                      (k === "\u232b" || k === "?123" || k === "ABC" || k === "\u21e7" ? " acc" : "");
        b.textContent = (kbdShift && k.length === 1 && /[a-z\u00f1]/.test(k)) ? k.toUpperCase() : k;
        b.onclick = () => {
          if (k === "\u232b") input.value = input.value.slice(0, -1);
          else if (k === "?123") { kbdLayout = "num"; kbdShift = false; draw(); return; }
          else if (k === "ABC") { kbdLayout = "abc"; kbdShift = false; draw(); return; }
          else if (k === "\u21e7") { kbdShift = !kbdShift; draw(); return; }
          else if (k === " ") input.value += " ";
          else input.value += (kbdShift && /[a-z\u00f1]/.test(k)) ? k.toUpperCase() : k;
          input.focus();
        };
        r.appendChild(b);
      });
      host.appendChild(r);
    });
  }
  draw();
}

/* ---------- paneles de arranque (red / proveedor) ---------- */
const panel = $("panel"), card = $("card");
function showPanel(h) { card.innerHTML = h; panel.classList.add("open"); }
function hidePanel() { panel.classList.remove("open"); card.innerHTML = ""; }

async function jget(u) { try { return await (await fetch(u)).json(); } catch { return {}; } }

async function boot() {
  if (panel.classList.contains("open")) return;
  const st = await jget("/llm/status");
  if (!st.lang) return panelLang();          /* 1) idioma del teclado */
  setLang(st.lang);
  const net = await jget("/net/status");
  if (!net.connected) return panelNet();      /* 2) red */
  if (!st.configured) return panelLLM();      /* 3) proveedor + clave */
  hidePanel();
}

async function panelLang() {
  const st = await jget("/llm/status");
  let html = "<h2>Idioma del teclado</h2>" +
    "<div class='sub'>Elígelo una vez. Se usa para el teclado físico y para el de pantalla.</div>" +
    "<ul class='netlist' id='lg'></ul>";
  showPanel(html);
  const ul = $("lg");
  LANGS.forEach(L => {
    const li = document.createElement("li");
    li.innerHTML = "<span class='d'></span><span class='n'></span><span class='sec'></span>";
    li.querySelector(".n").textContent = L.name;
    li.querySelector(".sec").textContent = L.code.toUpperCase();
    li.onclick = async () => {
      setLang(L.code);
      await jget("/llm/set?lang=" + encodeURIComponent(L.code));   /* persiste + aplica xkb */
      hidePanel();
      setTimeout(boot, 300);        /* continua con red / proveedor */
    };
    ul.appendChild(li);
  });
}

function esc(t) { return (t || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

async function panelNet() {
  const r = await jget("/net/list");
  const nets = r.networks || [];
  let html = "<h2>Conectar a una red</h2>" +
    "<div class='sub'>No hay internet. Sin red el agente no puede responder.</div>";
  if (!nets.length) {
    html += "<div class='msg'>No se ven redes. ¿Está el WiFi activado?</div>";
    showPanel(html);
    return;
  }
  html += "<ul class='netlist' id='nl'></ul>";
  showPanel(html);
  const nl = $("nl");
  nets.forEach(n => {
    const li = document.createElement("li");
    li.innerHTML = "<span class='d'></span><span class='n'></span><span class='sec'></span>";
    li.querySelector(".n").textContent = n.ssid;
    li.querySelector(".sec").textContent = (n.security === "abierta" || !n.security) ? "" : "\uD83D\uDD12";
    li.onclick = () => netPassword(n);      /* pasa a pedir la contrasena */
    nl.appendChild(li);
  });
}

function netPassword(n) {
  const abierta = (n.security === "abierta" || !n.security);
  showPanel(
    "<h2>" + (abierta ? "Conectar a " : "Contrase\u00f1a de ") +
      "<span class='ssid'>" + esc(n.ssid) + "</span></h2>" +
    "<div class='sub'>" + (abierta ? "Red abierta." : "Escribe la contrase\u00f1a del WiFi.") + "</div>" +
    (abierta ? "" : "<div class='field'><input id='pw' type='text' placeholder='Contrase\u00f1a' autocomplete='off' spellcheck='false'></div>" +
                    "<div id='kbd'></div>") +
    "<button class='btn' id='ok'>Conectar</button>" +
    "<button class='skip' id='back'>\u2190 Elegir otra red</button>" +
    "<div class='msg' id='m'></div>");
  const pwf = $("pw");
  if (pwf) { mountKbd(pwf); pwf.focus(); }
  $("ok").onclick = async () => {
    $("m").textContent = "Conectando a " + n.ssid + "\u2026";
    $("ok").disabled = true;
    const q = "/net/connect?ssid=" + encodeURIComponent(n.ssid) +
              "&password=" + encodeURIComponent(pwf ? pwf.value : "");
    const res = await jget(q);
    if (res.ok) { $("m").textContent = "Conectado."; setTimeout(hidePanel, 900); }
    else { $("m").textContent = "No se pudo conectar. " + esc(res.msg || ""); $("ok").disabled = false; }
  };
  $("back").onclick = () => panelNet();
}

async function panelLLM() {
  const st = await jget("/llm/status");
  let html = "<h2>Conectar con el modelo</h2>" +
    "<div class='sub'>Pega tu clave de API. Si no la tienes, abre la web del proveedor y cópiala.</div>" +
    "<div class='field'><input id='k' type='text' placeholder='Clave API (pégala)' autocomplete='off' spellcheck='false'></div>" +
    "<div id='kbd'></div>" +
    "<button class='btn' id='openweb'>Abrir la web del proveedor</button>" +
    "<div class='field'><input id='u' value='" + (st.base_url || "https://ollama.com/v1") + "'></div>" +
    "<div class='field'><input id='mo' value='" + (st.model || "deepseek-v4.1-flash:cloud") + "'></div>" +
    "<button class='btn' id='ok'>Guardar y empezar</button>" +
    "<button class='skip' id='skip'>Configurar más tarde</button><div class='msg' id='m'></div>";
  showPanel(html);
  const kf = $("k");
  if (kf) { mountKbd(kf); kf.focus(); }
  // Abrir la web del proveedor en el navegador del sistema (permite copiar la clave).
  $("openweb").onclick = () => {
    const url = ($("u").value || "").indexOf("openai") >= 0 ? "https://platform.openai.com/api-keys"
                                                            : "https://ollama.com/settings/keys";
    window.open(url, "_blank");     /* el agente/navegador la abre; luego se pega aquí */
  };
  $("ok").onclick = async () => {
    $("m").textContent = "Guardando…";
    await jget("/llm/set?backend=openai&key=" + encodeURIComponent($("k").value) +
               "&model=" + encodeURIComponent($("mo").value) +
               "&base_url=" + encodeURIComponent($("u").value));
    hidePanel();
  };
  $("skip").onclick = hidePanel;
}

</script>
</body>
</html>
